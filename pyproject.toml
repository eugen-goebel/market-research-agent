[project]
name = "market-research-agent"
version = "1.1.0"
description = "Multi-agent market research system, from web search to professional DOCX report"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.120.2",
    "fpdf2>=2.8.7",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: line length is handled by the formatter
# B008: FastAPI's Depends()/File() default-argument idiom is intentional
ignore = ["E501", "B008"]
